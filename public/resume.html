<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>于静凯 · 简历 / RESUME</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      :root {
        --bg-0: #05060a;
        --bg-1: #0a0c12;
        --cyan: #00e5ff;
        --line: rgba(255, 255, 255, 0.09);
        --text-0: #f2f5f9;
        --text-2: rgba(242, 245, 249, 0.66);
        --text-3: rgba(242, 245, 249, 0.4);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        background:
          radial-gradient(900px 520px at 78% -8%, rgba(0, 229, 255, 0.10), transparent 70%),
          radial-gradient(720px 420px at 12% 4%, rgba(124, 91, 255, 0.10), transparent 72%),
          var(--bg-0);
        color: var(--text-0);
        font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      img, video { -webkit-user-drag: none; user-select: none; }

      .bar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        height: 62px;
        padding: 0 clamp(18px, 4vw, 44px);
        background: rgba(5, 6, 10, 0.82);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(18px);
      }
      .bar-id {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); flex: none; }
      .bar-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
      .bar-title b { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; }
      .bar-title span { font-size: 12px; color: var(--text-3); letter-spacing: 0.14em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .bar-right { display: flex; align-items: center; gap: 14px; flex: none; }
      .viewonly {
        font-size: 11px;
        letter-spacing: 0.16em;
        color: var(--text-3);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 12px;
        white-space: nowrap;
      }
      .back {
        font-size: 12.5px;
        color: var(--text-2);
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: color 0.2s ease, border-color 0.2s ease;
        white-space: nowrap;
      }
      .back:hover { color: var(--cyan); border-color: rgba(0, 229, 255, 0.5); }

      .stage { padding: clamp(18px, 3vw, 34px) clamp(14px, 4vw, 40px) 56px; }
      .sheet {
        display: block;
        width: 100%;
        max-width: 880px;
        margin: 0 auto;
        height: auto;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
      }
      .hint {
        max-width: 880px;
        margin: 18px auto 0;
        font-size: 12px;
        line-height: 1.7;
        color: var(--text-3);
        text-align: center;
        letter-spacing: 0.02em;
      }
      @media (max-width: 640px) {
        .bar { height: 56px; }
        .bar-title span { display: none; }
        .viewonly { padding: 5px 9px; font-size: 10px; }
      }
    </style>
  </head>
  <body oncontextmenu="return false">
    <header class="bar">
      <div class="bar-id">
        <span class="dot"></span>
        <div class="bar-title">
          <b>于静凯 · 简历</b>
          <span>RESUME · 后期制作 / 杭州</span>
        </div>
      </div>
      <div class="bar-right">
        <span class="viewonly">仅供在线查看</span>
        <a class="back" href="/">返回作品集 ←</a>
      </div>
    </header>

    <main class="stage">
      <img
        class="sheet"
        src="/resume-preview.png"
        alt="于静凯的简历"
        draggable="false"
        oncontextmenu="return false"
      />
      <p class="hint">如需简历原件，请通过 3346371442@qq.com 与我联系。</p>
    </main>
  </body>
</html>
